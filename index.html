<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d7556">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Tienda Mazariego</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;600;700;800&display=swap">
<style>
html,body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
header .out{border:2px solid currentColor;background:transparent;color:inherit;border-radius:999px;padding:6px 14px;font-weight:800}
#login{position:fixed;inset:0;z-index:40;background:var(--bg);display:grid;place-items:center;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
#login .box{width:100%;max-width:380px;display:grid;gap:14px;text-align:center;justify-items:center}
#login .box p{margin:0}
#login .logo{width:84px;height:84px;border-radius:24px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
#login .logo svg{width:48px;height:48px}

/* Layout: one-column phone app — sticky header, scrolling content, cart bar + big bottom tabs */
:root{
  --bg:#eef3f0; --surface:#ffffff; --sunk:#e3ebe6; --ink:#16231e; --muted:#566660;
  --line:#d3ddd8; --accent:#0d7556; --accent-ink:#ffffff; --accent-soft:#d5ede3;
  --warn:#a5520a; --warn-soft:#fbe9d4; --danger:#b3261e; --danger-soft:#f8dcd9;
  --display:"Baloo 2", "Nunito", system-ui, sans-serif;
  --body:"Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r:16px; --nav-h:76px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1412; --surface:#17201d; --sunk:#111917; --ink:#e7efeb; --muted:#9db0a8;
  --line:#2a3833; --accent:#3cc594; --accent-ink:#04211a; --accent-soft:#163a2e;
  --warn:#f2a650; --warn-soft:#3a2a15; --danger:#f2786e; --danger-soft:#3d1c1a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1412; --surface:#17201d; --sunk:#111917; --ink:#e7efeb; --muted:#9db0a8;
  --line:#2a3833; --accent:#3cc594; --accent-ink:#04211a; --accent-soft:#163a2e;
  --warn:#f2a650; --warn-soft:#3a2a15; --danger:#f2786e; --danger-soft:#3d1c1a; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.4;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--accent)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:760px;margin:0 auto}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--accent);color:var(--accent-ink)}
header .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px}
header h1{font-family:var(--display);font-weight:800;font-size:1.5rem;margin:0;line-height:1.1}
header .day{font-size:.9rem;font-weight:700;opacity:.9;text-align:right}
#status{font-size:.95rem;font-weight:700;padding-block:8px;background:var(--warn-soft);color:var(--warn)}

main{padding-bottom:calc(var(--nav-h) + 90px + env(safe-area-inset-bottom,0px))}
section{padding-block:14px;display:grid;gap:14px}
h2{font-family:var(--display);font-size:1.45rem;margin:0;line-height:1.15}
.muted{color:var(--muted)}

.search{position:relative}
.search input{width:100%;height:56px;border-radius:999px;border:2px solid var(--line);background:var(--surface);padding:0 20px 0 50px;font-size:1.1rem;font-weight:600}
.search input:focus{border-color:var(--accent);outline:none}
.search svg{position:absolute;left:18px;top:50%;transform:translateY(-50%);width:22px;height:22px;stroke:var(--muted)}

.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 16px;font-weight:700;font-size:.98rem}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.card{display:grid;grid-template-rows:auto 1fr;text-align:left;border:2px solid var(--line);background:var(--surface);border-radius:var(--r);padding:0;overflow:hidden;transition:transform .08s}
.card:active{transform:scale(.97)}
.card .ph{aspect-ratio:1/1;max-width:100%;background:var(--sunk);display:grid;place-items:center;overflow:hidden}
.card .ph img{width:100%;height:100%;object-fit:cover}
.ph .letter{font-family:var(--display);font-weight:800;font-size:2.6rem;color:var(--muted)}
.card .info{padding:10px 12px 12px;display:grid;gap:2px;align-content:start;min-width:0}
.card .name{font-weight:800;font-size:1.02rem;line-height:1.2;overflow-wrap:anywhere}
.card .price{font-family:var(--display);font-weight:800;font-size:1.35rem;color:var(--accent);line-height:1.1}
.card .price small{font-family:var(--body);font-size:.85rem;font-weight:700;color:var(--muted)}
.stock{font-size:.85rem;font-weight:700;color:var(--muted)}
.stock.low{color:var(--warn)}
.stock.out{color:var(--danger)}

.empty{border:2px dashed var(--line);border-radius:var(--r);padding:28px 20px;text-align:center;display:grid;gap:10px;justify-items:center}
.empty p{margin:0;max-width:34ch}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:54px;padding:0 22px;border-radius:14px;border:2px solid transparent;font-weight:800;font-size:1.08rem}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--surface);border-color:var(--line)}
.btn.danger{background:var(--danger-soft);color:var(--danger)}
.btn.big{min-height:62px;font-size:1.2rem;width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row > .btn{flex:1 1 140px}

.list{display:grid;gap:10px}
.item{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:10px}
.item .thumb{width:64px;height:64px;border-radius:12px;background:var(--sunk);overflow:hidden;display:grid;place-items:center}
.item .thumb img{width:100%;height:100%;object-fit:cover}
.item .thumb .letter{font-size:1.6rem}
.item .mid{min-width:0;display:grid;gap:2px}
.item .t{font-weight:800;overflow-wrap:anywhere}
.item .s{font-size:.92rem;color:var(--muted);font-weight:600}
.item .acts{display:grid;gap:6px}
.sm{min-height:42px;padding:0 14px;font-size:.95rem;border-radius:12px}

.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:14px 16px}
.tile.hero{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tile .k{font-size:.82rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;opacity:.85}
.tile .v{font-family:var(--display);font-weight:800;font-size:2rem;line-height:1.1;font-variant-numeric:tabular-nums}
.panel{background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;gap:10px}
.line{display:flex;justify-content:space-between;gap:12px;align-items:baseline;font-variant-numeric:tabular-nums}
.line + .line{border-top:1px solid var(--line);padding-top:8px}
.line .l{min-width:0;overflow-wrap:anywhere}
.line .r{font-weight:800;white-space:nowrap}
input[type="date"]{height:52px;border-radius:14px;border:2px solid var(--line);background:var(--surface);padding:0 14px;font-weight:700}

#cartbar{position:fixed;left:0;right:0;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px));z-index:6;padding-block:8px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
#cartbar button{width:100%;max-width:736px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:64px;border:0;border-radius:18px;padding:0 20px;background:var(--ink);color:var(--bg);font-weight:800;font-size:1.1rem;box-shadow:0 8px 24px rgb(0 0 0 / .25)}
#cartbar .tot{font-family:var(--display);font-size:1.6rem;font-variant-numeric:tabular-nums}

nav{position:fixed;left:0;right:0;bottom:0;z-index:7;background:var(--surface);border-top:2px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav .tabs{display:grid;grid-template-columns:repeat(3,1fr);max-width:760px;margin:0 auto;height:var(--nav-h)}
nav button{border:0;background:none;display:grid;place-items:center;align-content:center;gap:2px;font-weight:800;font-size:.95rem;color:var(--muted)}
nav button svg{width:28px;height:28px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
nav button[aria-current="page"]{color:var(--accent)}

#overlay{position:fixed;inset:0;z-index:20;background:rgb(0 0 0 / .45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92%;overflow-y:auto;border-radius:22px 22px 0 0;padding-block:18px calc(18px + env(safe-area-inset-bottom,0px));padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));display:grid;gap:14px}
.sheet .head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.x{width:48px;height:48px;border-radius:50%;border:2px solid var(--line);background:var(--surface);font-size:1.4rem;line-height:1;flex:none}
.field{display:grid;gap:6px}
.field label,.lbl{font-weight:800;font-size:.98rem}
.field input,.field select{height:56px;border-radius:14px;border:2px solid var(--line);background:var(--surface);padding:0 16px;font-size:1.15rem;font-weight:700;width:100%}
.field input:focus{border-color:var(--accent);outline:none}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg button{min-height:54px;border-radius:14px;border:2px solid var(--line);background:var(--surface);font-weight:800}
.seg button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.quick{display:flex;gap:8px;flex-wrap:wrap}
.quick button{flex:1 1 60px;min-height:50px;border-radius:12px;border:2px solid var(--line);background:var(--surface);font-weight:800;font-size:1.05rem}
.bigtotal{font-family:var(--display);font-weight:800;font-size:3rem;line-height:1;color:var(--accent);font-variant-numeric:tabular-nums}
.photo{display:grid;grid-template-columns:110px 1fr;gap:14px;align-items:center}
.photo .ph{width:110px;height:110px;border-radius:16px;background:var(--sunk);overflow:hidden;display:grid;place-items:center;border:2px solid var(--line)}
.photo .ph img{width:100%;height:100%;object-fit:cover}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.qty{display:flex;align-items:center;gap:8px}
.qty button{width:44px;height:44px;border-radius:12px;border:2px solid var(--line);background:var(--surface);font-weight:800;font-size:1.3rem}
.qty span{min-width:2.2ch;text-align:center;font-weight:800;font-variant-numeric:tabular-nums}
.change{background:var(--accent-soft);color:var(--accent);border-radius:14px;padding:12px 16px;font-weight:800;font-size:1.25rem;display:flex;justify-content:space-between}
.change.short{background:var(--danger-soft);color:var(--danger)}

#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + 96px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:999px;font-weight:800;max-width:calc(100% - 32px);text-align:center;box-shadow:0 8px 24px rgb(0 0 0 / .25)}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>

<div id="login" hidden><div class="box">
  <div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l1.5-5h15L21 9"/><path d="M3 9h18v2a3 3 0 0 1-6 0 3 3 0 0 1-6 0 3 3 0 0 1-6 0z"/><path d="M5 13v7h14v-7"/><path d="M10 20v-4h4v4"/></svg></div>
  <h2 id="loginname">Bienvenida</h2>
  <p class="muted">Entra con tu cuenta de Google para vender y ver el inventario.</p>
  <button class="btn primary big" id="loginbtn">Entrar con Google</button>
  <p id="loginmsg" style="color:var(--danger);font-weight:700;margin:0"></p>
</div></div>


<header><div class="wrap"><div><h1 id="hdrname">Tienda</h1><div class="day" id="hdrday" style="text-align:left"></div></div><button id="logout" class="out" hidden>Salir</button></div></header>
<div id="status" hidden><div class="wrap" id="statustext"></div></div>

<main>
  <section id="v-vender" class="wrap">
    <div class="search"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Buscar producto…" autocomplete="off" aria-label="Buscar producto"></div>
    <div class="chips" id="cats"></div>
    <div class="grid" id="grid"></div>
    <div class="empty" id="vempty" hidden></div>
  </section>

  <section id="v-productos" class="wrap" hidden>
    <div class="row" style="align-items:center;justify-content:space-between"><h2>Productos</h2><button class="btn primary" id="addprod" style="flex:none">+ Nuevo producto</button></div>
    <div class="search"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="pq" type="search" placeholder="Buscar en productos…" autocomplete="off" aria-label="Buscar en productos"></div>
    <div class="list" id="plist"></div>
    <div class="empty" id="pempty" hidden><strong>Todavía no hay productos</strong><p class="muted">Toca “Nuevo producto” para agregar el primero con su foto, nombre y precio.</p></div>
  </section>

  <section id="v-resumen" class="wrap" hidden>
    <div class="row" style="align-items:center;justify-content:space-between"><h2>Resumen</h2><input type="date" id="day" aria-label="Día"></div>
    <div class="tiles"><div class="tile hero"><div class="k">Vendido</div><div class="v" id="r-total">$0.00</div></div><div class="tile"><div class="k">Ventas</div><div class="v" id="r-count">0</div></div></div>
    <div class="panel"><div class="lbl">Se están acabando</div><div id="r-low"></div></div>
    <div class="panel"><div class="lbl">Lo que más se vendió</div><div id="r-top"></div></div>
    <div class="panel"><div class="lbl">Ventas del día</div><div id="r-sales"></div></div>
  </section>
</main>

<div id="cartbar" hidden><button id="opencart"><span id="cartcount">0 productos</span><span>Cobrar <span class="tot" id="carttotal">$0.00</span></span></button></div>

<nav><div class="tabs">
  <button data-view="vender" aria-current="page"><svg viewBox="0 0 24 24"><path d="M3 4h2l2.4 11.2a2 2 0 0 0 2 1.6h7.7a2 2 0 0 0 2-1.5L21 8H6.2"/><circle cx="10" cy="20.5" r="1.3"/><circle cx="17" cy="20.5" r="1.3"/></svg>Vender</button>
  <button data-view="productos"><svg viewBox="0 0 24 24"><path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/></svg>Productos</button>
  <button data-view="resumen"><svg viewBox="0 0 24 24"><path d="M4 20V10"/><path d="M10 20V4"/><path d="M16 20v-7"/><path d="M22 20H2"/></svg>Resumen</button>
</div></nav>

<div id="overlay" hidden></div>
<div id="toast" hidden></div>


<script type="module">
/* =====================================================================
   CONFIG — lo único que necesitas cambiar
   ===================================================================== */
const CONFIG = {
  nombreTienda: "Tienda Mazariego",   // El nombre que sale arriba
  firebase: {                            // Datos del proyecto de Firebase "tienda-mazariego"
    apiKey: "AIzaSyBBrHS9Nd2rQ6TWicnzA8sq7ehoq3DxhSw",
    authDomain: "tienda-mazariego.firebaseapp.com",
    projectId: "tienda-mazariego",
    storageBucket: "tienda-mazariego.firebasestorage.app",
    messagingSenderId: "211970006383",
    appId: "1:211970006383:web:6e52b9ef56dbc0d5f25c9a"
  }
};
/* ===================================================================== */

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signInWithRedirect, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { initializeFirestore, persistentLocalCache, persistentMultipleTabManager, collection, doc, setDoc, updateDoc, deleteDoc, onSnapshot, query, orderBy, limit, increment } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const S={products:[],sales:[],cart:[],view:'vender',cat:'Todos',q:'',pq:'',day:'',db:null,canWrite:true,loaded:false};
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const r2=n=>Math.round((+n||0)*100)/100;
const money=n=>'$'+r2(n).toFixed(2);
const norm=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim();
const dayKey=(d=new Date())=>{const z=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate())};
const qtyTxt=(q,u)=>u==='lb'?(+(+q).toFixed(2))+' lb':String(q);
const safeImg=src=>typeof src==='string'&&/^data:image\/(jpeg|png|webp);base64,/.test(src)?src:'';
const minOf=p=>Number.isFinite(+p.min)&&p.min!==''?+p.min:5;
function phHTML(p){const src=safeImg(p.photo);return src?`<img src="${src}" alt="">`:`<span class="letter">${esc((p.name||'?').trim().charAt(0).toUpperCase())}</span>`}
function stockHTML(p){const s=+p.stock||0;const cls=s<=0?'out':(s<=minOf(p)?'low':'');const txt=s<=0?'Agotado':`Quedan ${qtyTxt(s,p.unit)}`;return `<span class="stock ${cls}">${txt}</span>`}

let toastT;function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2200)}
function setStatus(msg){$('#status').hidden=!msg;$('#statustext').textContent=msg||''}

/* ---------- Navegación ---------- */
document.querySelectorAll('nav button').forEach(b=>b.addEventListener('click',()=>{S.view=b.dataset.view;render();window.scrollTo(0,0)}));
function render(){
  ['vender','productos','resumen'].forEach(v=>{$('#v-'+v).hidden=S.view!==v;document.querySelector(`nav [data-view="${v}"]`).toggleAttribute('aria-current',S.view===v);if(S.view===v)document.querySelector(`nav [data-view="${v}"]`).setAttribute('aria-current','page')});
  renderVender();renderProductos();renderResumen();renderCartbar();
}

/* ---------- Vender ---------- */
$('#q').addEventListener('input',e=>{S.q=e.target.value;renderVender()});
function renderVender(){
  const cats=['Todos',...[...new Set(S.products.map(p=>(p.cat||'').trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'es'))];
  if(!cats.includes(S.cat))S.cat='Todos';
  $('#cats').hidden=cats.length<2;
  $('#cats').innerHTML=cats.map(c=>`<button class="chip" data-cat="${esc(c)}" aria-pressed="${c===S.cat}">${esc(c)}</button>`).join('');
  const q=norm(S.q);
  const list=S.products.filter(p=>(S.cat==='Todos'||(p.cat||'').trim()===S.cat)&&(!q||norm(p.name).includes(q))).sort((a,b)=>(a.name||'').localeCompare(b.name||'','es'));
  $('#grid').innerHTML=list.map(p=>`<button class="card" data-id="${esc(p.id)}"><div class="ph">${phHTML(p)}</div><div class="info"><span class="name">${esc(p.name)}</span><span class="price">${money(p.price)}${p.unit==='lb'?' <small>/ libra</small>':''}</span>${stockHTML(p)}</div></button>`).join('');
  const em=$('#vempty');
  if(list.length){em.hidden=true}else{em.hidden=false;
    em.innerHTML=!S.loaded&&!S.products.length?'<strong>Cargando productos…</strong>':
      S.products.length?`<strong>No hay productos con “${esc(S.q)}”</strong><p class="muted">Revisa cómo está escrito o búscalo con otra palabra.</p>`:
      '<strong>Aquí van a aparecer tus productos</strong><p class="muted">Agrégalos con su foto, nombre y precio, y luego tócalos para venderlos.</p><button class="btn primary" data-go="productos">Agregar productos</button>'}
}
$('#cats').addEventListener('click',e=>{const b=e.target.closest('[data-cat]');if(b){S.cat=b.dataset.cat;renderVender()}});
$('#vempty').addEventListener('click',e=>{if(e.target.closest('[data-go]')){S.view='productos';render()}});
$('#grid').addEventListener('click',e=>{const b=e.target.closest('.card');if(!b)return;const p=S.products.find(x=>x.id===b.dataset.id);if(!p)return;
  if(p.unit==='lb')openWeight(p);else{addToCart(p,1);toast('Agregado: '+p.name)}});

function addToCart(p,qty){const it=S.cart.find(i=>i.pid===p.id);if(it)it.qty=r2(it.qty+qty);else S.cart.push({pid:p.id,name:p.name,unit:p.unit||'u',price:+p.price||0,qty:r2(qty)});renderCartbar()}
const cartTotal=()=>r2(S.cart.reduce((s,i)=>s+r2(i.price*i.qty),0));
function renderCartbar(){const n=S.cart.length;$('#cartbar').hidden=!n||S.view!=='vender';$('#cartcount').textContent=n===1?'1 producto':n+' productos';$('#carttotal').textContent=money(cartTotal())}
$('#opencart').addEventListener('click',openCart);

/* ---------- Ventanas ---------- */
const ov=$('#overlay');
function openSheet(html){ov.innerHTML=`<div class="sheet" role="dialog" aria-modal="true">${html}</div>`;ov.hidden=false;document.body.style.overflow='hidden';const f=ov.querySelector('[autofocus]');if(f)setTimeout(()=>f.focus(),50)}
function closeSheet(){ov.hidden=true;ov.innerHTML='';document.body.style.overflow=''}
ov.addEventListener('click',e=>{if(e.target===ov||e.target.closest('.x'))closeSheet()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!ov.hidden)closeSheet()});
const head=(t,sub)=>`<div class="head"><div><h2>${t}</h2>${sub?`<div class="muted" style="font-weight:700">${sub}</div>`:''}</div><button class="x" aria-label="Cerrar">×</button></div>`;

function openWeight(p){
  openSheet(head(esc(p.name),`${money(p.price)} la libra`)+`
    <div class="two"><div class="field"><label for="w-lb">Libras</label><input id="w-lb" inputmode="decimal" autofocus placeholder="0"></div>
    <div class="field"><label for="w-usd">O cuánto en dinero ($)</label><input id="w-usd" inputmode="decimal" placeholder="0.00"></div></div>
    <div class="quick"><button data-lb="0.5">½ lb</button><button data-lb="1">1 lb</button><button data-lb="2">2 lb</button><button data-lb="3">3 lb</button></div>
    <div class="line"><span class="l">Total</span><span class="r bigtotal" id="w-tot" style="font-size:2.2rem">$0.00</span></div>
    <button class="btn primary big" id="w-ok">Agregar a la venta</button>`);
  const lb=$('#w-lb'),usd=$('#w-usd'),price=+p.price||0;
  const num=v=>parseFloat(String(v).replace(',','.'))||0;
  const upd=()=>$('#w-tot').textContent=money(num(lb.value)*price);
  lb.addEventListener('input',()=>{usd.value=lb.value?r2(num(lb.value)*price).toFixed(2):'';upd()});
  usd.addEventListener('input',()=>{lb.value=usd.value&&price?(+(num(usd.value)/price).toFixed(2)):'';upd()});
  ov.querySelector('.quick').addEventListener('click',e=>{const b=e.target.closest('[data-lb]');if(b){lb.value=b.dataset.lb;lb.dispatchEvent(new Event('input'))}});
  $('#w-ok').addEventListener('click',()=>{const q=num(lb.value);if(q<=0){toast('Escribe cuántas libras');return}addToCart(p,q);closeSheet();toast(`Agregado: ${qtyTxt(q,'lb')} de ${p.name}`)});
}

function openCart(){
  if(!S.cart.length){closeSheet();return}
  openSheet(head('La venta',`${S.cart.length} ${S.cart.length===1?'producto':'productos'}`)+`
    <div class="panel">${S.cart.map((i,k)=>`<div class="line" style="align-items:center"><div class="l"><div style="font-weight:800">${esc(i.name)}</div><div class="muted" style="font-size:.92rem;font-weight:600">${money(i.price)}${i.unit==='lb'?' / lb':' c/u'}</div></div>
      ${i.unit==='lb'?`<div class="qty"><span style="min-width:auto">${qtyTxt(i.qty,'lb')}</span><button data-del="${k}" aria-label="Quitar">×</button></div>`:`<div class="qty"><button data-dec="${k}" aria-label="Menos">−</button><span>${i.qty}</span><button data-inc="${k}" aria-label="Más">+</button></div>`}
      <span class="r" style="min-width:4.5em;text-align:right">${money(i.price*i.qty)}</span></div>`).join('')}</div>
    <div class="line"><span class="l" style="font-weight:800;font-size:1.2rem">Total</span><span class="r bigtotal">${money(cartTotal())}</span></div>
    <div class="row"><button class="btn danger" id="c-clear">Vaciar</button><button class="btn primary" id="c-pay" style="flex:2 1 180px">Cobrar</button></div>`);
  ov.querySelector('.panel').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
    if(b.dataset.inc)S.cart[+b.dataset.inc].qty++;
    if(b.dataset.dec){const i=S.cart[+b.dataset.dec];i.qty--;if(i.qty<=0)S.cart.splice(+b.dataset.dec,1)}
    if(b.dataset.del)S.cart.splice(+b.dataset.del,1);
    renderCartbar();openCart()});
  $('#c-clear').addEventListener('click',e=>{if(e.target.dataset.sure){S.cart=[];renderCartbar();closeSheet();toast('Venta vaciada')}else{e.target.dataset.sure='1';e.target.textContent='¿Seguro? Toca otra vez'}});
  $('#c-pay').addEventListener('click',openPay);
}

function openPay(){
  const total=cartTotal();
  openSheet(head('Cobrar')+`<div class="bigtotal" style="text-align:center">${money(total)}</div>
    <div class="field"><label for="p-paid">¿Con cuánto paga?</label><input id="p-paid" inputmode="decimal" placeholder="${total.toFixed(2)}"></div>
    <div class="quick"><button data-paid="exact">Exacto</button><button data-paid="1">$1</button><button data-paid="5">$5</button><button data-paid="10">$10</button><button data-paid="20">$20</button></div>
    <div class="change" id="p-change"><span>Vuelto</span><span>$0.00</span></div>
    <button class="btn primary big" id="p-ok">Confirmar venta</button>`);
  const inp=$('#p-paid');
  const paidVal=()=>inp.value?parseFloat(inp.value.replace(',','.'))||0:total;
  const upd=()=>{const ch=r2(paidVal()-total);const el=$('#p-change');el.classList.toggle('short',ch<0);el.innerHTML=ch<0?`<span>Faltan</span><span>${money(-ch)}</span>`:`<span>Vuelto</span><span>${money(ch)}</span>`};
  inp.addEventListener('input',upd);
  ov.querySelector('.quick').addEventListener('click',e=>{const b=e.target.closest('[data-paid]');if(!b)return;inp.value=b.dataset.paid==='exact'?total.toFixed(2):b.dataset.paid;upd()});
  $('#p-ok').addEventListener('click',async e=>{const paid=paidVal();if(paid<total){toast('Falta dinero para completar la venta');return}e.target.disabled=true;e.target.textContent='Guardando…';
    const ok=await saveSale(total,paid);if(ok){closeSheet();toast(`Venta guardada · Vuelto ${money(paid-total)}`)}else{e.target.disabled=false;e.target.textContent='Confirmar venta'}});
}

async function saveSale(total,paid){
  if(!S.db||!S.canWrite){toast('No tienes permiso para guardar ventas');return false}
  const now=new Date();
  const sale={ts:now.getTime(),day:dayKey(now),items:S.cart.map(i=>({pid:i.pid,name:i.name,unit:i.unit,price:i.price,qty:i.qty,sub:r2(i.price*i.qty)})),total,paid:r2(paid),change:r2(paid-total)};
  try{await S.db.collection('sales').add(sale)}catch(err){toast('No se pudo guardar. Revisa el internet e intenta otra vez.');return false}
  await adjustStock(sale.items,-1);
  S.cart=[];renderCartbar();return true;
}
async function adjustStock(items,sign){
  const by={};items.forEach(i=>{by[i.pid]=r2((by[i.pid]||0)+i.qty)});
  for(const pid of Object.keys(by)){const p=S.products.find(x=>x.id===pid);if(!p)continue;
    try{await S.db.doc('products/'+pid).update({stock:S.inc(r2(sign*by[pid]))})}catch(e){}}
}

/* ---------- Productos ---------- */
$('#pq').addEventListener('input',e=>{S.pq=e.target.value;renderProductos()});
$('#addprod').addEventListener('click',()=>openEdit(null));
function renderProductos(){
  $('#addprod').hidden=!S.canWrite;
  const q=norm(S.pq);
  const list=S.products.filter(p=>!q||norm(p.name).includes(q)||norm(p.cat).includes(q)).sort((a,b)=>(a.name||'').localeCompare(b.name||'','es'));
  $('#plist').innerHTML=list.map(p=>`<div class="item"><div class="thumb ph">${phHTML(p)}</div><div class="mid"><span class="t">${esc(p.name)}</span><span class="s">${money(p.price)}${p.unit==='lb'?' / libra':''}${p.cat?' · '+esc(p.cat):''}</span>${stockHTML(p)}</div>
    ${S.canWrite?`<div class="acts"><button class="btn primary sm" data-restock="${esc(p.id)}">+ Llegó</button><button class="btn ghost sm" data-edit="${esc(p.id)}">Editar</button></div>`:'<span></span>'}</div>`).join('');
  $('#pempty').hidden=!(S.loaded&&!S.products.length);
  if(S.products.length&&!list.length)$('#plist').innerHTML=`<div class="empty"><strong>No hay productos con “${esc(S.pq)}”</strong></div>`;
}
$('#plist').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const id=b.dataset.edit||b.dataset.restock;const p=S.products.find(x=>x.id===id);if(!p)return;b.dataset.edit?openEdit(p):openRestock(p)});

function shrink(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const m=360,s=Math.min(1,m/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(img,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.72))};img.onerror=rej;img.src=r.result};r.onerror=rej;r.readAsDataURL(file)})}

function openEdit(p){
  const isNew=!p;p=p||{name:'',cat:'',unit:'u',price:'',stock:'',min:'',photo:''};
  let photo=safeImg(p.photo),unit=p.unit==='lb'?'lb':'u';
  const cats=[...new Set(S.products.map(x=>(x.cat||'').trim()).filter(Boolean))];
  openSheet(head(isNew?'Nuevo producto':'Editar producto')+`
    <div class="photo"><div class="ph" id="e-ph">${photo?`<img src="${photo}" alt="">`:'<span class="letter muted" style="font-family:var(--display);font-size:1rem;font-weight:800">Sin foto</span>'}</div>
      <div style="display:grid;gap:8px"><label class="btn ghost filebtn">📷 ${photo?'Cambiar foto':'Poner foto'}<input type="file" id="e-file" accept="image/*"></label>${photo?'<button class="btn ghost sm" id="e-nophoto">Quitar foto</button>':''}</div></div>
    <div class="field"><label for="e-name">Nombre</label><input id="e-name" value="${esc(p.name)}" placeholder="Ej. Coca-Cola 600 ml" ${isNew?'autofocus':''}></div>
    <div class="field"><span class="lbl">¿Cómo se vende?</span><div class="seg" id="e-unit"><button data-u="u" aria-pressed="${unit==='u'}">Por unidad</button><button data-u="lb" aria-pressed="${unit==='lb'}">Por libra</button></div></div>
    <div class="two"><div class="field"><label for="e-price" id="e-plbl">${unit==='lb'?'Precio por libra ($)':'Precio ($)'}</label><input id="e-price" inputmode="decimal" value="${esc(p.price)}" placeholder="0.00"></div>
    <div class="field"><label for="e-stock" id="e-slbl">${unit==='lb'?'Libras que hay':'Cuántos hay'}</label><input id="e-stock" inputmode="decimal" value="${esc(p.stock)}" placeholder="0"></div></div>
    <div class="two"><div class="field"><label for="e-cat">Categoría</label><input id="e-cat" list="e-cats" value="${esc(p.cat)}" placeholder="Ej. Bebidas"><datalist id="e-cats">${cats.map(c=>`<option value="${esc(c)}">`).join('')}</datalist></div>
    <div class="field"><label for="e-min">Avisar cuando queden</label><input id="e-min" inputmode="decimal" value="${esc(p.min)}" placeholder="5"></div></div>
    <button class="btn primary big" id="e-save">Guardar</button>
    ${isNew?'':'<button class="btn danger" id="e-del">Borrar producto</button>'}`);
  $('#e-file').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;try{photo=await shrink(f);$('#e-ph').innerHTML=`<img src="${photo}" alt="">`}catch(_){toast('No se pudo abrir esa foto, prueba con otra')}});
  const np=$('#e-nophoto');if(np)np.addEventListener('click',()=>{photo='';$('#e-ph').innerHTML='<span class="muted" style="font-weight:800">Sin foto</span>';np.remove()});
  $('#e-unit').addEventListener('click',e=>{const b=e.target.closest('[data-u]');if(!b)return;unit=b.dataset.u;$('#e-unit').querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));$('#e-plbl').textContent=unit==='lb'?'Precio por libra ($)':'Precio ($)';$('#e-slbl').textContent=unit==='lb'?'Libras que hay':'Cuántos hay'});
  $('#e-save').addEventListener('click',async e=>{
    const n=v=>parseFloat(String(v).replace(',','.'));
    const name=$('#e-name').value.trim(),price=n($('#e-price').value);
    if(!name){toast('Escribe el nombre del producto');return}
    if(!(price>=0)){toast('Escribe el precio');return}
    const minV=n($('#e-min').value);
    const data={name,cat:$('#e-cat').value.trim(),unit,price:r2(price),stock:r2(n($('#e-stock').value)||0),min:Number.isFinite(minV)?minV:5,photo,updatedAt:Date.now()};
    e.target.disabled=true;e.target.textContent='Guardando…';
    try{isNew?await S.db.collection('products').add(data):await S.db.doc('products/'+p.id).set(data);closeSheet();toast(isNew?'Producto agregado':'Cambios guardados')}
    catch(err){e.target.disabled=false;e.target.textContent='Guardar';toast('No se pudo guardar. Revisa el internet e intenta otra vez.')}});
  const del=$('#e-del');if(del)del.addEventListener('click',async()=>{if(!del.dataset.sure){del.dataset.sure='1';del.textContent='¿Seguro? Toca otra vez para borrar';return}
    try{await S.db.doc('products/'+p.id).delete();closeSheet();toast('Producto borrado')}catch(_){toast('No se pudo borrar')}});
}

function openRestock(p){
  const lb=p.unit==='lb';
  openSheet(head('Llegó mercadería',`${esc(p.name)} · ahora hay ${qtyTxt(+p.stock||0,p.unit)}`)+`
    <div class="field"><label for="r-n">${lb?'¿Cuántas libras llegaron?':'¿Cuántos llegaron?'}</label><input id="r-n" inputmode="decimal" autofocus placeholder="0"></div>
    <div class="quick">${(lb?[5,10,25,50]:[6,12,24,48]).map(v=>`<button data-n="${v}">+${v}</button>`).join('')}</div>
    <button class="btn primary big" id="r-ok">Sumar al inventario</button>`);
  const inp=$('#r-n');
  ov.querySelector('.quick').addEventListener('click',e=>{const b=e.target.closest('[data-n]');if(b)inp.value=b.dataset.n});
  $('#r-ok').addEventListener('click',async()=>{const v=parseFloat(inp.value.replace(',','.'));if(!(v>0)){toast('Escribe cuánto llegó');return}
    try{await S.db.doc('products/'+p.id).update({stock:S.inc(r2(v))});closeSheet();toast(`Sumado: ${qtyTxt(v,p.unit)} de ${p.name}`)}catch(_){toast('No se pudo guardar')}});
}

/* ---------- Resumen ---------- */
$('#day').addEventListener('change',e=>{S.day=e.target.value||dayKey();renderResumen()});
function renderResumen(){
  const sales=S.sales.filter(s=>s.day===S.day);
  $('#r-total').textContent=money(sales.reduce((a,s)=>a+(+s.total||0),0));
  $('#r-count').textContent=sales.length;
  const low=S.products.filter(p=>(+p.stock||0)<=minOf(p)).sort((a,b)=>(+a.stock||0)-(+b.stock||0));
  $('#r-low').innerHTML=low.length?low.map(p=>`<div class="line"><span class="l">${esc(p.name)}</span><span class="r ${(+p.stock||0)<=0?'stock out':'stock low'}" style="font-size:1rem">${(+p.stock||0)<=0?'Agotado':'Quedan '+qtyTxt(+p.stock||0,p.unit)}</span></div>`).join(''):'<span class="muted">Todo bien surtido.</span>';
  const agg={};sales.forEach(s=>(s.items||[]).forEach(i=>{const k=i.pid||i.name;agg[k]=agg[k]||{name:i.name,unit:i.unit,qty:0,sub:0};agg[k].qty=r2(agg[k].qty+(+i.qty||0));agg[k].sub=r2(agg[k].sub+(+i.sub||0))}));
  const top=Object.values(agg).sort((a,b)=>b.sub-a.sub).slice(0,8);
  $('#r-top').innerHTML=top.length?top.map(t=>`<div class="line"><span class="l">${esc(t.name)} <span class="muted">× ${qtyTxt(t.qty,t.unit)}</span></span><span class="r">${money(t.sub)}</span></div>`).join(''):'<span class="muted">Sin ventas este día.</span>';
  $('#r-sales').innerHTML=sales.length?sales.map(s=>{const t=new Date(s.ts).toLocaleTimeString('es',{hour:'numeric',minute:'2-digit'});const desc=(s.items||[]).map(i=>`${qtyTxt(i.qty,i.unit)} ${i.name}`).join(', ');
    return `<div class="line" style="align-items:center"><div class="l"><div style="font-weight:800">${esc(t)} · ${money(s.total)}</div><div class="muted" style="font-size:.9rem;font-weight:600">${esc(desc)}</div></div>${S.canWrite?`<button class="btn ghost sm" data-void="${esc(s.id)}">Anular</button>`:''}</div>`}).join(''):'<span class="muted">Todavía no hay ventas este día.</span>';
}
$('#r-sales').addEventListener('click',async e=>{const b=e.target.closest('[data-void]');if(!b)return;
  if(!b.dataset.sure){b.dataset.sure='1';b.textContent='¿Anular?';return}
  const s=S.sales.find(x=>x.id===b.dataset.void);if(!s)return;b.disabled=true;
  try{await S.db.doc('sales/'+s.id).delete();await adjustStock(s.items||[],1);toast('Venta anulada y devuelta al inventario')}catch(_){b.disabled=false;toast('No se pudo anular')}});

/* ---------- Arranque ---------- */
function setDay(){const now=new Date();S.day=S.day||dayKey(now);$('#day').value=S.day;$('#hdrday').textContent=now.toLocaleDateString('es',{weekday:'long',day:'numeric',month:'long'})}

/* ---------- Conexión con Firebase ---------- */
const fail=err=>{console.error(err);toast(err&&err.code==='permission-denied'?'Tu cuenta no tiene permiso para guardar':'No se pudo guardar. Revisa el internet.')};
function makeAdapter(fs){
  // Las escrituras se guardan primero en el celular y se suben solas cuando hay internet.
  const fire=p=>{p.catch(fail);return Promise.resolve()};
  return {
    collection:name=>({add:data=>{const ref=doc(collection(fs,name));return fire(setDoc(ref,data)).then(()=>ref)}}),
    doc:path=>({set:data=>fire(setDoc(doc(fs,path),data)),update:data=>fire(updateDoc(doc(fs,path),data)),delete:()=>fire(deleteDoc(doc(fs,path)))})
  };
}
let unsubs=[];
function startData(fs){
  const timer=setTimeout(()=>{if(!S.loaded)setStatus('Todavía no se pueden cargar los productos. Revisa el internet.')},10000);
  const denied=e=>{clearTimeout(timer);S.loaded=true;S.canWrite=false;
    setStatus(e&&e.code==='permission-denied'?'Esta cuenta no tiene permiso. Pide que agreguen tu correo a la tienda.':'No se pudieron cargar los datos. Cierra y vuelve a abrir la página.');render()};
  unsubs.push(onSnapshot(collection(fs,'products'),{includeMetadataChanges:true},snap=>{
    S.products=snap.docs.map(d=>({id:d.id,...d.data()}));
    S.loaded=true;clearTimeout(timer);setStatus(snap.metadata.fromCache&&!navigator.onLine?'Sin internet: puedes seguir vendiendo, se guardará al volver la señal.':'');
    S.cart.forEach(i=>{const p=S.products.find(x=>x.id===i.pid);if(p){i.price=+p.price||0;i.name=p.name}});render()},denied));
  unsubs.push(onSnapshot(query(collection(fs,'sales'),orderBy('ts','desc'),limit(2000)),snap=>{S.sales=snap.docs.map(d=>({id:d.id,...d.data()}));renderResumen()},()=>{}));
}
function init(){
  setDay();
  $('#hdrname').textContent=CONFIG.nombreTienda;$('#loginname').textContent=CONFIG.nombreTienda;document.title=CONFIG.nombreTienda;
  if(CONFIG.firebase.apiKey.startsWith('PEGA')){$('#login').hidden=false;$('#loginmsg').textContent='Falta pegar los datos de Firebase en el archivo (busca “CONFIG”).';$('#loginbtn').hidden=true;return}
  const app=initializeApp(CONFIG.firebase);
  const fs=initializeFirestore(app,{localCache:persistentLocalCache({tabManager:persistentMultipleTabManager()})});
  const auth=getAuth(app);
  S.db=makeAdapter(fs);S.inc=n=>increment(n);
  $('#loginbtn').addEventListener('click',async()=>{$('#loginmsg').textContent='';
    try{await signInWithPopup(auth,new GoogleAuthProvider())}
    catch(e){if(e&&e.code==='auth/popup-blocked')signInWithRedirect(auth,new GoogleAuthProvider());else if(e&&e.code!=='auth/popup-closed-by-user')$('#loginmsg').textContent='No se pudo entrar. Intenta otra vez.'}});
  $('#logout').addEventListener('click',()=>signOut(auth));
  onAuthStateChanged(auth,user=>{
    unsubs.forEach(u=>u());unsubs=[];
    if(user){$('#login').hidden=true;$('#logout').hidden=false;S.canWrite=true;S.loaded=false;render();startData(fs)}
    else{$('#login').hidden=false;$('#logout').hidden=true;S.products=[];S.sales=[];S.cart=[];render()}
  });
  render();
}
init();
window.addEventListener('online',()=>setStatus(''));
window.addEventListener('offline',()=>setStatus('Sin internet: puedes seguir vendiendo, se guardará al volver la señal.'));

</script>
